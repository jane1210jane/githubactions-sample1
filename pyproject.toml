[project]
name = "sales-report"
version = "0.1.0"
description = "売上CSVを月次集計する学習用サンプルアプリ"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sales-report = "sales_report.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_report"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tools/ は配布物に含めないが、テストからは import したいので import パスに追加する。
pythonpath = ["tools"]
# カバレッジは表示するだけ。CI のゲートにするのは Stage 4。
addopts = "--cov=sales_report --cov=check_doc_citations --cov-report=term-missing"

[tool.ruff]
line-length = 100
# 教材ドキュメント内のコード断片は読みやすさのために手で改行している。
# ruff に整形させると解説の意図が崩れるため対象外にする。
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
