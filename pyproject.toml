[project]
name = "sales-report"
version = "0.1.0"
description = "売上CSVを月次集計する学習用サンプルアプリ"
requires-python = ">=3.12"
dependencies = []

# Lambda ハンドラ（Task 9 で追加）が S3 を読み書きするために必要。
# 実行時に必要なのは Lambda コンテナの中だけなので、通常の dependencies には
# 入れず、コンテナ側だけが参照する extra として分離する。
[project.optional-dependencies]
aws = ["boto3>=1.34"]

[project.scripts]
sales-report = "sales_report.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_report"]

[dependency-groups]
dev = [
  "boto3>=1.34",
  "moto[s3]>=5.0",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.16.1",
  "zizmor>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tools/ は配布物に含めないが、テストからは import したいので import パスに追加する。
pythonpath = ["tools"]
# Stage 4: カバレッジを表示するだけでなく、閾値を下回ったら落とすゲートにする。
addopts = "--cov=sales_report --cov=check_doc_citations --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
# 教材ドキュメント内のコード断片は読みやすさのために手で改行している。
# ruff に整形させると解説の意図が崩れるため対象外にする。
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
# 型注釈が無い関数を見逃さない。後から緩めるより最初から厳しくするほうが楽。
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
# tests は対象外。テストは振る舞いを検証する場所であって、
# 型の厳密さを競う場所ではない。
exclude = ["^tests/"]

# boto3 は型スタブを同梱していない。スタブを増やすより、
# 境界のこのモジュールだけ緩めるほうが管理が単純。
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
