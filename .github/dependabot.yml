# SHA でピン留めすると、更新が自動では入ってこなくなる。
# 放置すると「動かないが古い」状態で固まるので、更新の検知は仕組みに任せる。
version: 2
updates:
  # .github/workflows と .github/actions の両方が対象になる。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Python の依存も同じ理由で見張る。
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
